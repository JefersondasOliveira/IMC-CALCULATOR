<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <h1 class="titulo">Tabela IMC</h1>

        <form class="form">
                <section class="tabela">

            <div class="imc__tabela">
                <h2>IMC</h2>
                <p>Menos que 18,5</p>
                <p>Entre 18,5 e 24,9</p>
                <p>Entre 25 e 29,9</p>
                <p>30 e 34,9</p>
                <p>35 e 39,9</p>
                <p>Mais do que 40</p>
            </div>

            <div class="resultado__tabela">
                <h2>Resultado</h2>
                <p class="imc1">Abaixo do peso</p>
                <p class="imc2">Peso normal</p>
                <p class="imc3">Sobrepeso</p>
                <p class="imc4">Obesidade Grau 1</p>
                <p class="imca5">Obesidade Grau 2</p>
                <p class="imc6">Obesidade Grau 3</p>
            </div>
        </section>

        <div class="calculo">
            <h1>Calcule seu IMC</h1>
            <p>nome: <br><input type="text" class="nome" placeholder="nome"></p>
            <p>Altura: <br><input type="text" class="altura" placeholder="1.75"></p>
            <p>Peso: <br><input type="text" class="peso" placeholder="Ex: 60"</p> <br>
            <button class="botao__calcular" type="submit">Calcular</button>
            <p class="x"></p>
        </div>

        </form>
    </main>
</body>
